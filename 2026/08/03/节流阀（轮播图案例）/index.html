        <h2 id="节流阀（轮播图案例）">节流阀（轮播图案例）</h2>
<p>这里主要讲一下节流阀的原理是怎么实现的，主要用到轮播图里的左/右箭头</p>
<figure class="highlight javascript"><table><tr><td class="code"><pre><code class="hljs javascript">right.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&#x27;click&#x27;</span>, <span class="hljs-keyword">function</span> (<span class="hljs-params"></span>) &#123;<br>            <span class="hljs-keyword">if</span> (flag) &#123;<br>                flag = <span class="hljs-literal">false</span>;<br>                <span class="hljs-comment">//箭头判断</span><br>                <span class="hljs-keyword">if</span> (num &gt; ul.<span class="hljs-property">children</span>.<span class="hljs-property">length</span> - <span class="hljs-number">2</span>) &#123;<br>                    num = <span class="hljs-number">0</span><br>                    ul.<span class="hljs-property">style</span>.<span class="hljs-property">left</span> = <span class="hljs-number">0</span>;<br>                &#125;<br><br>                num++<br>                <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&#x27;箭头&#x27;</span> + num);<br>                <span class="hljs-title class_">Animate</span>(ul, - num * box.<span class="hljs-property">offsetWidth</span>, <span class="hljs-keyword">function</span> (<span class="hljs-params"></span>) &#123;<br>                    flag = <span class="hljs-literal">true</span>;<br>                &#125;);<br>                circle++<br><br>                <span class="hljs-comment">// 圆圈判断</span><br>                <span class="hljs-keyword">if</span> (circle &gt; ol.<span class="hljs-property">children</span>.<span class="hljs-property">length</span> - <span class="hljs-number">1</span>) &#123;<br>                    circle = <span class="hljs-number">0</span><br>                &#125;<br>                <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&#x27;圆圈&#x27;</span> + circle);<br>                <span class="hljs-title function_">circleClean</span>()<br><br>            &#125;<br><br><br>        &#125;)<br>        <span class="hljs-comment">//9.左箭头点击，图片移动</span><br>        left .<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&#x27;click&#x27;</span>, <span class="hljs-keyword">function</span> (<span class="hljs-params"></span>) &#123;<br>            <span class="hljs-keyword">if</span> (flag) &#123;<br>                flag = <span class="hljs-literal">false</span>;<br>                <span class="hljs-comment">//箭头判断</span><br>                <span class="hljs-keyword">if</span> (num == <span class="hljs-number">0</span>) &#123;<br>                    num = ul.<span class="hljs-property">children</span>.<span class="hljs-property">length</span> - <span class="hljs-number">1</span><br>                    ul.<span class="hljs-property">style</span>.<span class="hljs-property">left</span> = -num * box.<span class="hljs-property">offsetWidth</span> + <span class="hljs-string">&#x27;px&#x27;</span>;<br>                &#125;<br><br><br>                num--<br>                <span class="hljs-title class_">Animate</span>(ul, -num * box.<span class="hljs-property">offsetWidth</span>, <span class="hljs-keyword">function</span> (<span class="hljs-params"></span>) &#123;<br>                    flag = <span class="hljs-literal">true</span>;<br>                &#125;);<br>                <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(circle);<br><br>                circle--<br><br>                <span class="hljs-comment">// 圆圈判断</span><br>                <span class="hljs-keyword">if</span> (circle &lt; <span class="hljs-number">0</span>) &#123;<br>                    circle = ol.<span class="hljs-property">children</span>.<span class="hljs-property">length</span> - <span class="hljs-number">1</span>;<br>                &#125;<br><br><br>                <span class="hljs-title function_">circleClean</span>()<br>            &#125;<br></code></pre></td></tr></table></figure>
<p>首先声明一个全局变量flag作为节流阀，然后我们在动画执行完后才能执行下一个动画，也就是在click外层直接套一个判断，判断没通过，直接不执行所有代码</p>
<figure class="highlight sqf"><table><tr><td class="code"><pre><code class="hljs sqf">(<span class="hljs-number">1</span>)<span class="hljs-built_in">flag</span>默认为<span class="hljs-literal">true</span>，当我们点击的时候，<span class="hljs-built_in">flag</span>变为<span class="hljs-literal">false</span>，此时它没法执行左箭头或者右箭头。当动画结束后，才会执行<span class="hljs-built_in">Animate</span>的回调函数<span class="hljs-built_in">flag</span>这时候才会变成<span class="hljs-literal">true</span>，因为加了判断条件，<span class="hljs-built_in">flag</span>为<span class="hljs-literal">true</span>的时候才能进入左/右箭头的代码<br>(<span class="hljs-number">2</span>)也就是当我们进入<span class="hljs-keyword">if</span>的一瞬间，先把<span class="hljs-built_in">flag</span>改为<span class="hljs-literal">false</span>，让其他箭头没法进入代码(<span class="hljs-built_in">flag</span>为<span class="hljs-literal">true</span>才能进入click里面的所有代码)，等动画执行完毕后才会执行回调函数，这个时候<span class="hljs-built_in">flag</span>再改为<span class="hljs-literal">true</span><br></code></pre></td></tr></table></figure>
